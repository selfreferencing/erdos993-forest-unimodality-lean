name = "Erdos993Lean"
version = "0.1.0"
defaultTargets = ["Erdos993LeanNoCertificates21"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.28.0"

[[lean_lib]]
name = "Erdos993Lean"

# Optional (not part of the default target): the floor at orders 19 and 20, checked by the kernel.
# `lake build Erdos993LeanKernelExtra`; see the header of `Erdos993Lean/Floor/KernelExtra.lean`.
[[lean_lib]]
name = "Erdos993LeanKernelExtra"
roots = ["Erdos993Lean.Floor.KernelExtra"]

# Optional (not part of the default target until clean): the analytic route for forests with at
# least 61 vertices (campaign ProofRuns/2026-09-28_analytic_large_n).  `lake build Erdos993LeanAnalytic`.
[[lean_lib]]
name = "Erdos993LeanAnalytic"
roots = ["Erdos993Lean.Analytic.Defs", "Erdos993Lean.Ceiling.ValleyFree",
  "Erdos993Lean.Analytic.Window", "Erdos993Lean.Analytic.Translate",
  "Erdos993Lean.Analytic.Top", "Erdos993Lean.Analytic.TopCore", "Erdos993Lean.Analytic.Consistency",
  "Erdos993Lean.Analytic.HardCore.Mixture", "Erdos993Lean.Analytic.HardCore.Weight",
  "Erdos993Lean.Analytic.HardCore.Laplace", "Erdos993Lean.Analytic.HardCore.Tail",
  "Erdos993Lean.Analytic.HardCore.Leaves", "Erdos993Lean.Analytic.HardCore.Variance",
  "Erdos993Lean.Analytic.Density", "Erdos993Lean.Analytic.TopCert",
  "Erdos993Lean.Analytic.NoValley.Core", "Erdos993Lean.Analytic.NoValley.FiniteRange",
  "Erdos993Lean.Analytic.NoValley.Identities", "Erdos993Lean.Analytic.NoValley.LossForm",
  "Erdos993Lean.Analytic.NoValley.LogConcave", "Erdos993Lean.Analytic.NoValley.FibreHalf",
  "Erdos993Lean.Analytic.NoValley.FibreGeneral",
  "Erdos993Lean.Analytic.NoValley.Explicit", "Erdos993Lean.Analytic.Tail",
  "Erdos993Lean.Analytic.Fourier.Gauss", "Erdos993Lean.Analytic.Fourier.CharFun",
  "Erdos993Lean.Analytic.Fourier.Circle", "Erdos993Lean.Analytic.Fourier.Majorant",
  "Erdos993Lean.Analytic.Fourier.Numerics", "Erdos993Lean.Analytic.Fourier.Main",
  "Erdos993Lean.Analytic.LargeMean.Main", "Erdos993Lean.Analytic.Assembly",
  "Erdos993Lean.Analytic.AssemblyCore",
  "Erdos993Lean.Analytic.All", "Erdos993Lean.Analytic.Profile30",
  "Erdos993Lean.Analytic.Family", "Erdos993Lean.Analytic.Glue30",
  "Erdos993Lean.Analytic.Density.Bands", "Erdos993Lean.Analytic.Density.Transfer",
  "Erdos993Lean.Analytic.Density.Partition", "Erdos993Lean.Analytic.Density.Paths",
  "Erdos993Lean.Analytic.Density.Record", "Erdos993Lean.Analytic.Density.Branches",
  "Erdos993Lean.Analytic.Density.Induction", "Erdos993Lean.Analytic.Density.Records",
  "Erdos993Lean.Analytic.Density.Main", "Erdos993Lean.Analytic.TailCert.Glue",
  "Erdos993Lean.Analytic.TailCert.Sound", "Erdos993Lean.Analytic.Atlas.Checker",
  "Erdos993Lean.Analytic.Atlas.Params", "Erdos993Lean.Analytic.Atlas.Kernel",
  "Erdos993Lean.Analytic.Atlas.Bounds", "Erdos993Lean.Analytic.Atlas.Taylor",
  "Erdos993Lean.Analytic.Atlas.Atoms", "Erdos993Lean.Analytic.Atlas.Fibres",
  "Erdos993Lean.Analytic.Atlas.Sound", "Erdos993Lean.Analytic.Atlas.Profile",
  "Erdos993Lean.Analytic.Atlas.Hyps", "Erdos993Lean.Analytic.Reserve.Defs",
  "Erdos993Lean.Analytic.Reserve.Entropy", "Erdos993Lean.Analytic.Reserve.Tail",
  "Erdos993Lean.Analytic.Reserve.Step", "Erdos993Lean.Analytic.Reserve.StepBand",
  "Erdos993Lean.Analytic.Reserve.Moments", "Erdos993Lean.Analytic.Reserve.Tree",
  "Erdos993Lean.Analytic.Reserve.Induction", "Erdos993Lean.Analytic.Reserve.Assembly",
  "Erdos993Lean.Analytic.Reserve.UpperDefs", "Erdos993Lean.Analytic.Reserve.Cert.Sound",
  "Erdos993Lean.Analytic.Reserve.Cert.Leaf", "Erdos993Lean.Analytic.Reserve.UpperBounds",
